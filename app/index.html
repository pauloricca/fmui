<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YS200 · YSEDITOR Tribute</title>
<link rel="stylesheet" href="styles.css?v=retro-interaction-20260909"><script src="ys200.js?v=command-order-20260908" defer></script><script src="effects.js?v=command-order-20260908" defer></script><script src="waveforms.js?v=20260909" defer></script><script src="ys200-profile.js?v=command-order-20260908" defer></script><script src="dx7.js?v=command-order-20260908" defer></script><script src="dx7-profile.js?v=command-order-20260908" defer></script><script src="synths.js?v=command-order-20260908" defer></script><script src="storage.js?v=20260909" defer></script><script src="editor.js?v=lcd-overlay-20260908" defer></script><script src="effects-ui.js?v=command-order-20260908" defer></script><script src="midi-protocol.js?v=command-order-20260908" defer></script><script src="midi-transport.js?v=command-order-20260908" defer></script><script src="retro-select.js?v=command-order-20260908" defer></script><script src="midi-ui.js?v=command-order-20260908" defer></script>
<script src="modulations.js?v=20260909" defer></script>
<script src="retro-interaction.js?v=20260909" defer></script>
<script src="session.js?v=20260909" defer></script>
</head>
<body>
<main>
<section class="window" aria-label="YSEditor voice editor">
<header class="window-title"><h1>YAMAHA 4-OP EDITOR</h1><button id="display-overlay" aria-pressed="false" title="Toggle LCD display colour">LCD</button><button id="zoom" aria-label="Toggle fullscreen">↗</button></header>
<div class="commands">
<div class="engine-switch" role="group" aria-label="FM engine"><button id="engine-6op" aria-pressed="false" title="Yamaha DX7">6-OP</button><button id="engine-4op" aria-pressed="true" title="Yamaha YS200">4-OP</button></div>
<label class="voice-name">VOICENAME:<input id="voice-name" maxlength="10" value="FloatChime" aria-label="Voice name"></label>
<button id="midi-settings">MIDI</button><button id="device-controls">CONFIG</button><button id="receive">RECEIVE VOICE</button><button id="transmit">SEND VOICE</button>
<button id="show-voice" aria-pressed="true" aria-controls="voice-screen">VOICE</button><button id="show-effects" aria-pressed="false" aria-controls="effects-screen">EFFECT</button>
<button id="show-pitch" hidden aria-pressed="false">PITCH</button><button id="seed">RANDOMISE</button><button id="compare" aria-pressed="false">COMPARE</button><button id="show-modulations" aria-pressed="false" aria-controls="modulations-screen">MODULATIONS</button><button id="mappings" aria-pressed="false" title="Toggle controller mappings">MAPPINGS</button>
</div>
<div id="voice-screen" class="editor-screen">
<div class="group-captions"><span></span><span>LOW FREQUENCY OSCILLATOR</span><span>SENSITIVITY</span><span></span></div>
<div class="global-row"><section id="algorithm-diagram" aria-label="Algorithm routing diagram"></section>
<section id="global-controls" class="sliders globals" aria-label="Global voice parameters"></section></div>
<section id="operators" class="operators" aria-label="Four operators"></section>
<div id="pitch-preview" hidden></div>
<section id="operator-controls" class="sliders lower" aria-label="Selected operator parameters"></section>
<div class="bottom-captions"><span>OSCILLATOR</span><span>ENVELOPE GENERATOR</span><span>REV</span><span>KBD SCALING</span><span>OUT</span></div>
</div>
<section id="effects-screen" class="effects-screen" hidden aria-label="Effects editor">
<div class="effects-layout"><section class="effect-programs"><h2>EFFECT PROGRAM</h2><div id="fx-programs"></div></section>
<section class="effect-detail"><h2 id="fx-name"></h2><div class="effect-controls" id="fx-controls"></div><div class="effect-readout"><p id="fx-summary"></p><p id="fx-description"></p><p>TIME / SIZE: MIDI INDEX 0–40</p><p>BALANCE 0 = EFFECT OFF</p></div></section>
</div>
</section>
<section id="modulations-screen" hidden aria-label="Virtual modulations"><div class="mod-top" id="mod-top"></div><div class="mod-macros sliders" id="mod-macros"></div></section>
<footer class="editor-status"><span id="status" role="status">READY. SELECT A SLIDER OR OPERATOR.</span><span id="edit-state">EDIT BUFFER</span></footer>
</section>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><header class="window-title dialog-titlebar"><button type="button" id="dialog-close" aria-label="Close dialog">×</button><h2 id="dialog-title"></h2></header><div id="dialog-content"></div></dialog>
</body>
</html>
